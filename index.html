<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character and Word Counter - VEDA Technology</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Character and Word Counter</h1>

        <p class="subtitle">
            Count characters, words, and sentences as you type
        </p>

        <textarea
            id="textInput"
            placeholder="Type or paste your text here..."
        ></textarea>

        <div class="counter-box">

            <div class="counter">
                <span id="characterCount">0</span>
                <p>Characters</p>
            </div>

            <div class="counter">
                <span id="wordCount">0</span>
                <p>Words</p>
            </div>

            <div class="counter">
                <span id="sentenceCount">0</span>
                <p>Sentences</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
